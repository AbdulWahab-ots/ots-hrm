name: Auto frontend-hr-management-system

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Create .env file
        run: |
          echo "NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" > .env
          


      - name: Install Dependencies
        run: npm ci

      - name: Build App
        run: npm run build
        

      - name: Prepare Deployment Directory
        run: |
          mkdir deploy
          cp -r .next public deploy/
          cp package*.json deploy/
          cp next.config.* deploy/
          echo "✅ Deployment directory prepared"

      - name: Upload New Build (flatten structure)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "deploy/**"
          target: "/var/www/html/frontend-hr-management-system"
          strip_components: 1
          overwrite: true

      - name: Install Node Modules on Server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /var/www/html/frontend-hr-management-system
            npm install --production
            echo "✅ node_modules installed"

      - name: Restart App with PM2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /var/www/html/frontend-hr-management-system
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi
            pm2 delete frontend-hr-management-system || true
            pm2 start npm --name "frontend-hr-management-system" -- start
            pm2 save
            pm2 startup systemd -u $USER --hp $HOME || true
            echo "✅ PM2 process restarted successfully"

      - name: Reload Nginx
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            sudo systemctl reload nginx
            echo "✅ Nginx successfully reloaded"
